<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- Template used to render og-acquisitions.jpg (1200x630). Not linked from the site. -->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: 'Geist', system-ui, sans-serif; }
  .card {
    width: 1200px; height: 630px; position: relative;
    background: linear-gradient(135deg, #f3f8ff 0%, #e0edff 55%, #dbeafe 100%);
    display: flex; align-items: center;
  }
  .left { padding: 0 0 0 84px; width: 720px; position: relative; z-index: 2; }
  .tag { font-size: 20px; letter-spacing: 0.1em; font-weight: 600; color: #2563eb; text-transform: lowercase; margin-bottom: 30px; }
  h1 { font-size: 68px; font-weight: 600; line-height: 1.06; letter-spacing: -0.03em; color: #0f172a; margin-bottom: 28px; text-transform: lowercase; }
  .sub { font-size: 26px; color: #475569; line-height: 1.5; margin-bottom: 42px; max-width: 600px; text-transform: lowercase; }
  .site { font-size: 22px; font-weight: 600; color: #2563eb; }
  .photo {
    position: absolute; right: 70px; top: 50%; transform: translateY(-50%);
    width: 340px; height: 360px; border-radius: 28px; overflow: hidden; z-index: 1;
    box-shadow: 0 30px 70px rgba(15,23,42,0.25);
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
</style>
</head>
<body>
  <div class="card">
    <div class="left">
      <div class="tag">surrey, bc · buyer</div>
      <h1>hi, i'm sam.</h1>
      <div class="sub">i'm looking to buy a bc service business, and keep building the legacy that you started.</div>
      <div class="site">samfranco.ca/acquisitions</div>
    </div>
    <div class="photo"><img src="images/sam.jpg" alt="" /></div>
  </div>
</body>
</html>
