<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- Template used to render og.jpg (1200x630). Not linked from the site. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; }
  .card {
    width: 1200px; height: 630px; position: relative;
    background:
      radial-gradient(ellipse 900px 500px at 18% -10%, rgba(200,150,60,0.20) 0%, transparent 60%),
      radial-gradient(ellipse 700px 500px at 108% 110%, rgba(200,150,60,0.12) 0%, transparent 60%),
      #0d0c0a;
    display: flex; align-items: center;
  }
  .left { padding: 0 0 0 84px; width: 760px; position: relative; z-index: 2; }
  .tag {
    display: inline-block; background: rgba(232,200,122,0.1);
    border: 1px solid rgba(232,200,122,0.32);
    color: #c9a84c; font-size: 19px; letter-spacing: 0.12em; font-weight: 600;
    padding: 10px 24px; border-radius: 40px; margin-bottom: 38px; text-transform: uppercase;
  }
  h1 { font-size: 64px; font-weight: 600; line-height: 1.08; letter-spacing: -0.03em; color: #faf8f4; margin-bottom: 30px; }
  h1 em { color: #c9a84c; font-style: normal; }
  .sub { font-size: 25px; color: #948e83; line-height: 1.5; margin-bottom: 44px; max-width: 620px; }
  .site { font-size: 22px; font-weight: 600; color: #e8c87a; letter-spacing: 0.02em; }
  .photo {
    position: absolute; right: -30px; bottom: 0; width: 470px; height: 630px; z-index: 1;
    overflow: hidden;
  }
  .photo img {
    width: 470px; height: 630px; object-fit: cover; object-position: top center;
    filter: grayscale(1) contrast(1.05) brightness(0.92);
  }
  .photo::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, #0d0c0a 0%, rgba(13,12,10,0.55) 26%, rgba(13,12,10,0) 60%),
                linear-gradient(0deg, rgba(13,12,10,0.7) 0%, rgba(13,12,10,0) 36%);
  }
  .frame { position: absolute; inset: 0; border: 2px solid rgba(232,200,122,0.18); z-index: 3; pointer-events: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="left">
      <span class="tag">AI-Powered · Done For You</span>
      <h1>Your life and your business. <em>Running on one system.</em></h1>
      <div class="sub">A custom AI operating system built around you. Built once. Yours forever. Runs every day.</div>
      <div class="site">samfranco.ca</div>
    </div>
    <div class="photo"><img src="images/sam.jpg" alt="" /></div>
    <div class="frame"></div>
  </div>
</body>
</html>
